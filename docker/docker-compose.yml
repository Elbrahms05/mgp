# Environnement de développement local PACIPA-MGP (back-office).
#
# Usage :
#   docker compose -f docker/docker-compose.yml up -d --build
#   docker compose -f docker/docker-compose.yml exec app php artisan migrate --seed
#
# ODK Central n'est PAS inclus ici (stack Compose dédiée volumineuse) : le déploiement
# ODK Central est décrit dans claude-deploy.md. Le pont ODK côté back-office (odk:sync)
# se configure via les variables ODK_* dans mgp-office/.env.

services:
  db:
    image: postgres:16-alpine
    container_name: mgp_db
    environment:
      POSTGRES_DB: ${DB_DATABASE:-pacipa_mgp}
      POSTGRES_USER: ${DB_USERNAME:-pacipa}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-pacipa}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mgp_redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: mgp_app
    working_dir: /var/www
    volumes:
      - ../mgp-office:/var/www
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-pacipa_mgp}
      DB_USERNAME: ${DB_USERNAME:-pacipa}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis

  web:
    image: nginx:alpine
    container_name: mgp_web
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ../mgp-office:/var/www
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

volumes:
  db_data:
  redis_data:
