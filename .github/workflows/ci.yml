name: CI mgp-office

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

defaults:
  run:
    working-directory: mgp-office

jobs:
  tests:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # Extensions requises : sodium (chiffrement VBG), pdo_sqlite (tests), gd (DomPDF), zip (Excel)
          extensions: mbstring, pdo, sqlite3, pdo_sqlite, sodium, gd, zip, bcmath, intl, fileinfo
          coverage: none
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: mgp-office/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('mgp-office/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          # Clé de chiffrement VBG (32 octets base64) requise par VbgEncryptionService
          echo "VBG_ENCRYPTION_KEY=$(php -r 'echo base64_encode(random_bytes(32));')" >> .env

      - name: Run tests
        run: php artisan test --no-interaction

  lint:
    name: Code style (Pint)
    runs-on: ubuntu-latest
    # Informatif : ne bloque pas la CI tant que le style n'est pas uniformisé sur tout le dépôt.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Check code style
        run: vendor/bin/pint --test
